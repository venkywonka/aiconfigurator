[pytest]
# Front-insert the src-layout package root so a bare `pytest` imports THIS clone's
# aiconfigurator, not a foreign editable install (.pth) leaked in from an active venv
# (e.g. a codex worktree). `.` alone cannot shadow a src-layout package: the top-level
# package lives under src/, so the venv's __editable__*.pth append wins. Listing src
# first makes pytest's front-insert beat the .pth -> the canonical clone under test.
pythonpath = src .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --durations=10
    --maxfail=0
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
timeout = 120
markers =
    unit: fast tests (unit + lightweight integration, no external services)
    integration: integration tests that exercise multiple components together (uses perf database)
    e2e: marks tests as end-to-end integration tests
    sweep: marks tests as sweep tests covering many combinations
    build: marks tests intended for GitHub build workflows (fast and stable subset of e2e)
    support_matrix: marks PR-level support matrix smoke tests